<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Shield - Join</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global-ai.css">
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-slate-100">

  <!-- AUTH CONTAINER -->
  <div
    class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 glass-card rounded-[4rem] overflow-hidden shadow-[0_50px_100px_-20px_rgba(0,0,0,0.1)] transition-none hover:transform-none">

    <!-- LEFT SIDE: BRAND/VISUAL -->
    <div class="hidden lg:flex flex-col justify-between p-20 bg-indigo-600 relative overflow-hidden">
      <div class="absolute -top-40 -left-40 w-[30rem] h-[30rem] bg-rose-400/30 rounded-full blur-[120px]"></div>
      <div class="absolute -bottom-40 -right-40 w-[30rem] h-[30rem] bg-indigo-800/40 rounded-full blur-[120px]"></div>

      <div class="relative z-10">
        <a href="index.html"
          class="w-16 h-16 bg-white rounded-[2rem] flex items-center justify-center text-3xl shadow-2xl mb-12 hover:rotate-12 transition-transform">🛡️</a>
        <h2 class="text-6xl font-black text-white leading-tight mb-8">Join the <br><span
            class="text-rose-200">Guardians.</span></h2>
        <p class="text-indigo-100 text-2xl font-medium max-w-sm leading-relaxed italic">"Protection is not a privilege,
          it is a right."</p>
      </div>

      <div class="relative z-10 space-y-4">
        <div class="flex items-center gap-4 text-white/60 font-black tracking-widest text-xs uppercase">
          <span class="w-8 h-[2px] bg-white/20"></span> 2026 ELITE PROTECTION
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: SIGNUP FORM -->
    <div class="p-12 md:p-24 bg-white/40 backdrop-blur-3xl flex flex-col justify-center">
      <div class="mb-12 lg:hidden">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-4">🛡️</div>
      </div>

      <h1 class="text-5xl font-black text-slate-900 mb-4 tracking-tight">Create Identity</h1>
      <p class="text-slate-500 font-bold mb-12 text-lg">Initialize your account on the shield network.</p>

      <form id="signupForm" class="space-y-8">
        <div>
          <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Email Protocol</label>
          <input type="email" id="email" required placeholder="recruit@civicshield.ai"
            class="w-full px-8 py-5 rounded-3xl bg-white/60 border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition font-semibold text-slate-800 text-lg">
        </div>
        <div>
          <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Secure Key</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-8 py-5 rounded-3xl bg-white/60 border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition font-semibold text-slate-800 text-lg">
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-6 rounded-3xl shadow-2xl shadow-indigo-100 transition transform active:scale-[0.98] text-xl uppercase tracking-widest glow-pulse">
          INITIALIZE ACCOUNT
        </button>

        <p id="msg" class="text-sm text-center text-rose-600 font-black"></p>
      </form>

      <div class="mt-14 text-center">
        <p class="text-slate-400 font-black text-sm uppercase tracking-widest">
          Already a Protector?
          <a href="login.html" class="text-indigo-600 hover:underline ml-2">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module" src="./signup.js"></script>
  <script src="global-ai.js"></script>

</body>

</html>
