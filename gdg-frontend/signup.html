<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <form id="signupForm" class="bg-white p-6 rounded shadow w-96">
    <h2 class="text-2xl font-bold mb-4 text-center">Create Account</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      class="w-full border p-2 mb-3 rounded"
      required
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
      class="w-full border p-2 mb-3 rounded"
      required
    />

    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded"
    >
      Sign Up
    </button>

    <p id="msg" class="text-sm text-center mt-3 text-red-600"></p>
  </form>

  <!-- ✅ VERY IMPORTANT -->
  <script type="module" src="./signup.js"></script>

</body>
</html>
