<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Shield - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    <!-- Header -->
    <div class="bg-indigo-600 p-8 text-center relative overflow-hidden">
      <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-indigo-500 rounded-full blur-xl opacity-50"></div>
      <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-32 h-32 bg-indigo-700 rounded-full blur-xl opacity-50"></div>

      <a href="index.html" class="inline-block relative z-10 text-4xl mb-2">🛡️</a>
      <h2 class="text-2xl font-bold text-white relative z-10">Welcome Back</h2>
      <p class="text-indigo-200 text-sm mt-1 relative z-10">Sign in to access your dashboard</p>
    </div>

    <!-- Form -->
    <div class="p-8">
      <form id="loginForm" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com"
            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            required />
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
            <a href="#" class="text-sm text-indigo-600 hover:text-indigo-500 font-medium">Forgot?</a>
          </div>
          <input id="password" type="password" placeholder="••••••••"
            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            required />
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition transform active:scale-95">
          Sign In
        </button>

        <p id="msg" class="text-sm text-center text-rose-600 font-medium"></p>
      </form>

      <div class="mt-8 text-center">
        <p class="text-slate-600 text-sm">
          Don't have an account?
          <a href="signup.html" class="text-indigo-600 hover:text-indigo-500 font-semibold transition">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>

</html>
