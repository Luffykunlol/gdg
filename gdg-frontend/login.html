<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Civic Shield - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">

  <form id="loginForm" class="bg-white p-6 rounded shadow w-96">
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      class="w-full border p-2 mb-3 rounded"
      required
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
      class="w-full border p-2 mb-3 rounded"
      required
    />

    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded"
    >
      Login
    </button>

    <p id="msg" class="mt-3 text-center text-red-600"></p>
  </form>

  <script type="module" src="login.js"></script>
</body>
</html>
