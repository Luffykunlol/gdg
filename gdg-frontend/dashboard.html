<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Shield - Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global-ai.css">
  <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.sh/@google/generative-ai"
      }
    }
  </script>
</head>

<body class="min-h-screen text-slate-900 flex flex-col">

  <nav class="sticky top-0 z-50 bg-white/40 backdrop-blur-xl border-b border-white/20">
    <div class="max-w-7xl mx-auto px-6 lg:px-12">
      <div class="flex justify-between items-center h-20">
        <div class="flex items-center gap-3">
          <a href="index.html"
            class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-indigo-200">🛡️</a>
          <span class="font-bold text-xl tracking-tight">Civic<span class="text-indigo-600">Shield</span></span>
        </div>
        <div class="flex items-center gap-6">
          <span id="welcome" class="text-slate-500 font-bold hidden sm:block"></span>
          <button id="logoutBtn" class="text-slate-600 hover:text-red-600 font-black transition">Sign Out</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto w-full px-6 lg:px-12 py-12">

    <div class="mb-12">
      <h1 class="text-5xl font-black text-slate-900 leading-tight">Civic <span class="text-vibrant">Command
          Center</span></h1>
      <p class="text-slate-500 mt-3 text-lg font-medium italic">High-tech protection for the modern citizen.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">

      <!-- Input Column -->
      <div class="lg:col-span-5 space-y-8">
        <div class="glass-card rounded-[2.5rem] p-10">
          <h2 class="text-2xl font-black mb-8 flex items-center gap-3">
            <span class="bg-indigo-100 p-2 rounded-xl">🛠️</span> Analysis Tools
          </h2>

          <div class="space-y-6">
            <!-- File Upload -->
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Target
                Document</label>
              <div class="relative group">
                <input type="file" id="docFile" accept=".txt,.pdf"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                <div
                  class="border-4 border-dashed border-slate-200 rounded-[2rem] p-8 text-center group-hover:border-indigo-400 group-hover:bg-indigo-50/50 transition-all">
                  <div class="text-4xl mb-3">☁️</div>
                  <p id="fileName" class="text-slate-500 font-bold">Drop file or <span
                      class="text-indigo-600">browse</span></p>
                </div>
              </div>
            </div>

            <!-- Question Input -->
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Specific AI
                Query</label>
              <textarea id="userQuestion" rows="3" placeholder="e.g. Detect hidden liabilities or scams..."
                class="w-full px-6 py-4 rounded-2xl bg-white/50 border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition font-semibold text-slate-700"></textarea>
            </div>

            <!-- Language Select -->
            <div>
              <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Response
                Language</label>
              <select id="language"
                class="w-full px-6 py-4 rounded-2xl bg-white/50 border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition font-bold text-slate-700 appearance-none cursor-pointer">
                <option value="English">English</option>
                <option value="Hindi">Hindi (हिंदी)</option>
                <option value="Bengali">Bengali (বাংলা)</option>
                <option value="Telugu">Telugu (తెలుగు)</option>
                <option value="Marathi">Marathi (मराठी)</option>
                <option value="Tamil">Tamil (தமிழ்)</option>
                <option value="Gujarati">Gujarati (ગુજરાતી)</option>
                <option value="Urdu">Urdu (اردو)</option>
                <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
                <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
                <option value="Malayalam">Malayalam (മലയാളം)</option>
                <option value="Punjabi">Punjabi (ਪੰਜਾਬี)</option>
              </select>
            </div>

            <!-- Analyze Button -->
            <button id="analyzeBtn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-[2rem] shadow-2xl shadow-indigo-100 transition transform active:scale-[0.98] flex items-center justify-center gap-3 text-lg glow-pulse uppercase tracking-wider">
              <span>🔍</span> Run Protection Scan
            </button>
          </div>
        </div>
      </div>

      <!-- Results Column -->
      <div class="lg:col-span-7">
        <div class="glass-card rounded-[2.5rem] p-10 h-full flex flex-col min-h-[600px]">
          <div class="flex items-center justify-between mb-8 pb-6 border-b border-slate-100">
            <h2 class="text-2xl font-black flex items-center gap-3">
              <span class="bg-blue-100 p-2 rounded-xl">📊</span> Live Analysis
            </h2>
            <span class="text-xs font-black text-slate-300 tracking-[0.2em]">ENCRYPTED.AI</span>
          </div>

          <!-- Active Result Area -->
          <div id="result" class="flex-grow hidden animate-fade-in-up">
            <!-- Results will be injected here by JS -->
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="flex-grow flex flex-col items-center justify-center text-center">
            <div class="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center text-5xl mb-6 opacity-40">
              🛡️</div>
            <h3 class="text-2xl font-black text-slate-900 mb-2">Systems Ready</h3>
            <p class="text-slate-400 font-bold italic max-w-xs">Awaiting document or query input for scanning...</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // Logic to toggle empty state
    const resultDiv = document.getElementById('result');
    const emptyState = document.getElementById('emptyState');
    const observer = new MutationObserver(() => {
      if (!resultDiv.classList.contains('hidden')) {
        emptyState.classList.add('hidden');
      } else {
        emptyState.classList.remove('hidden');
      }
    });
    observer.observe(resultDiv, { attributes: true });
  </script>

  <!-- DASHBOARD SCRIPT -->
  <footer class="text-center py-6 text-slate-300 text-xs font-bold uppercase tracking-widest">
    Civic Command Center v2.1
  </footer>
  <script type="module" src="dashboard.js"></script>
  <script src="global-ai.js"></script>

</body>

</html>
