<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Civic Shield – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-indigo-700">🛡 Civic Shield</h1>
    <button
      id="logoutBtn"
      class="text-red-600 font-semibold hover:underline"
    >
      Logout
    </button>
  </header>

  <!-- MAIN -->
  <main class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">

    <!-- USER INFO -->
    <h2
      id="welcome"
      class="text-xl font-semibold mb-6 text-gray-700"
    >
      Loading user...
    </h2>

    <!-- UPLOAD DOCUMENT -->
    <div class="mb-6">
      <label class="block font-medium mb-2">
        📄 Upload Document
      </label>
      <input
        type="file"
        id="docFile"
        accept=".txt"
        class="w-full border rounded-lg p-3"
      />
      <p class="text-sm text-gray-500 mt-1">
        (Text files only for now)
      </p>
    </div>

    <!-- QUESTION -->
    <div class="mb-6">
      <label class="block font-medium mb-2">
        ❓ Ask Your Question
      </label>
      <textarea
        id="userQuestion"
        rows="3"
        placeholder="What is written here? Is this fraud? What should I do?"
        class="w-full border rounded-lg p-3"
      ></textarea>
    </div>

    <!-- LANGUAGE -->
    <div class="mb-6">
      <label class="block font-medium mb-2">
        🌐 Output Language
      </label>
      <select
        id="language"
        class="w-full border rounded-lg p-3"
      >
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Malayalam">Malayalam</option>
        <option value="Tamil">Tamil</option>
      </select>
    </div>

    <!-- ANALYZE BUTTON -->
    <button
      id="analyzeBtn"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition"
    >
      🔍 Analyze Document & Answer
    </button>

    <!-- RESULT -->
    <div
      id="result"
      class="hidden mt-8 bg-gray-50 border rounded-lg p-6"
    ></div>

  </main>

  <!-- DASHBOARD SCRIPT -->
  <script type="module" src="dashboard.js"></script>

</body>
</html>
